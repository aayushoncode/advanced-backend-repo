services:
  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  gateway1:
    build: ./backend/gateway
    ports:
      - 9001:9000
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME="gateway1"

  gateway2:
    build: ./backend/gateway
    ports:
      - 9002:9000
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME="gateway2"

  auth-service:
    build: ./backend/services/auth
    ports:
      - 5001:5000
    env_file:
      - ./backend/services/auth/.env
    environment:
      - SERVER_NAME="auth-service"
  payment-service:
    build: ./backend/services/payment
    ports:
      - 6001:6000
    env_file:
      - ./backend/services/payment/.env
    environment:
      - SERVER_NAME="payment-service"
  product-service:
    build: ./backend/services/product
    ports:
      - 7001:7000
    env_file:
      - ./backend/services/product/.env
    environment:
      - SERVER_NAME="product-service"
